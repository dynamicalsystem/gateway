name: Build Docker Image

on:
  push:
    branches:
      - main
      - develop
      - oci_tf_files
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TF_VAR_user_data_template: ${{ github.workspace }}/setup_tinsnip_box.sh.tpl
      TF_VAR_ufw_take_over_script: ${{ github.workspace }}/scripts/ufw_take_over.sh
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive -diff terraform/
      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -input=false -backend-config=path=/tmp/ci.tfstate
          terraform validate
      - name: Render cloud-init templates and syntax-check them
        working-directory: terraform
        run: |
          for tpl in setup_tinsnip_box.sh.tpl setup_secure_tunnel.sh.tpl; do
            echo "templatefile(\"../$tpl\", {domain=\"example.com\", email=\"a@example.com\", hostname=\"ci\", public=false, ufw_take_over=file(\"../scripts/ufw_take_over.sh\")})" \
              | terraform console | python3 -c 'import sys,ast; print(ast.literal_eval(sys.stdin.read().strip()))' > /tmp/$tpl.sh
            bash -n /tmp/$tpl.sh && echo "$tpl renders and parses"
          done
      - uses: astral-sh/setup-uv@v5
      - name: Python compile and unit tests
        run: |
          uv sync --frozen
          uv run python -m py_compile terraform_deploy.py main.py scripts/*.py
          uv run pytest -q

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max